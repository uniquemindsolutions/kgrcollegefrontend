<section class="aboutUs">
  <div class="bannerImg">
    <img src="assets/Images/bpharmacyBanner.jpg" alt="" class="mba_banner_image w-100" />
  </div>
  <div class="aboutSection position-relative py-5 mb-4">
    <div class="container">
      <h1 class="pp-c">Committes</h1>
      <table class="table table-bordered">
        <thead class="table-light">
          <tr class="table-active">
            <th class="text-center">Sl No:</th>
            <th class="text-center">Committe Name</th>
            <th class="text-center">File</th>
          </tr>
          <tr *ngFor="let item of committes; let i = index">
            <td class="text-center">{{ i + 1 }}</td>
            <td class="text-center">{{ item.name }}</td>
            <td class="text-center">
              <a [href]="item.file" target="_blank" download>
                Download File
              </a>
            </td>
          </tr>          
        </thead>
      </table>
    </div>
  </div>
</section>
